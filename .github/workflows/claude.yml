name: Claude

# Skriv @claude i en issue, en kommentar eller en PR-granskning så gör Claude
# ändringen som en PR (eller svarar). CI kör testerna på PR:en som vanligt, och
# deployen sker först när PR:en mergas. Bara Gunnar kan starta det.
# Kräver GitHub-appen Claude (github.com/apps/claude) på repot och hemligheten
# CLAUDE_CODE_OAUTH_TOKEN (från `claude setup-token`, går på abonnemanget).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'gunnarr' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # så att Claude kan läsa CI-resultat på PR:er
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
